apiVersion: apps/v1
kind: Deployment
metadata:
  name: titlis-ui
  namespace: titlis-system
  labels:
    app: titlis-ui
spec:
  selector:
    matchLabels:
      app: titlis-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: titlis-ui
    spec:
      containers:
      - name: titlis-ui
        image: gcr.io/jeitto-backend/titlis-ui/develop:latest
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          limits:
            memory: 256Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 100m
        env:
        - name: API_UPSTREAM
          value: "http://titlis-api:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: titlis-ui
  namespace: titlis-system
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: titlis-ui
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: titlis-ui-hpa
  namespace: titlis-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: titlis-ui
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
