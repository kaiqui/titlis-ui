server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /v1 para a titlis-api-ts dentro do cluster
    location /v1/ {
        proxy_pass http://titlis-api-ts:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # SSE: desabilita buffering para streaming funcionar
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: tudo que não é arquivo vai pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
