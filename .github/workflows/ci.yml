name: CI

# titlis-ui: apenas testes na PR. Sem push DockerHub e sem deploy (build de prod é
# feito via scripts/Coolify fora deste fluxo, conforme decisão do time).
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + testes (vitest) + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
